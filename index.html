<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tycoon WebAR</title>
    <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
    <script src="https://cdn.8thwall.com/web/aframe/8frame.js"></script>
    <script src="script.js"></script>
    <style>body { margin: 0; }</style>
  </head>
  <body>
    <a-scene
      xrextras-almost-there
      xrextras-loading
      xrextras-runtime-error
      xrweb
      renderer="colorManagement: true;"
    >
      <!-- Câmera -->
      <a-camera position="0 1.6 0" look-controls="true"></a-camera>

      <!-- Personagem (Cubo) -->
      <a-box id="player"
             color="#4CC3D9"
             position="0 0 -1"
             depth="0.3"
             height="0.3"
             width="0.3"
             player-move>
      </a-box>

      <!-- Farming Point (Esfera) -->
      <a-sphere id="coin"
                color="#FFC107"
                position="0 0 -2"
                radius="0.2">
      </a-sphere>

      <!-- Texto de Pontuação -->
      <a-text id="score" value="Pts: 0" position="0 1.8 -2" color="#FFF"></a-text>
    </a-scene>
  </body>
</html>
