<!DOCTYPE html>
<html>
  <head>
    <title>AR Car Collect Coins</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- A-Frame e AR.js -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.4/aframe/build/aframe-ar.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 999;
      }
      #controls button {
        padding: 15px;
        font-size: 20px;
        margin: 5px;
        background-color: rgba(0,0,0,0.6);
        color: white;
        border: none;
        border-radius: 10px;
      }
      #score {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,0.5);
        color: white;
        padding: 10px 20px;
        font-size: 18px;
        border-radius: 8px;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <!-- Cena AR -->
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; gpsMinAccuracy: 100; gpsTimeInterval: 1000;"
    >
      <!-- Carro (Cubo Azul) -->
      <a-box
        id="car"
        gps-entity-place="latitude: -22.9068; longitude: -43.1729;"
        position="0 0 0"
        depth="0.5"
        height="0.5"
        width="0.5"
        color="blue"
      ></a-box>

      <!-- Moedas (Esferas Douradas) -->
      <a-sphere
        class="coin"
        gps-entity-place="latitude: -22.9069; longitude: -43.1730;"
        position="0 0 0"
        radius="0.2"
        color="gold"
      ></a-sphere>
      <a-sphere
        class="coin"
        gps-entity-place="latitude: -22.9070; longitude: -43.1731;"
        position="0 0 0"
        radius="0.2"
        color="gold"
      ></a-sphere>
      <a-sphere
        class="coin"
        gps-entity-place="latitude: -22.9071; longitude: -43.1732;"
        position="0 0 0"
        radius="0.2"
        color="gold"
      ></a-sphere>

      <!-- Câmera -->
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <!-- Controles -->
    <div id="controls">
      <button onclick="moveCar(0, 0, -0.0001)">⬆️</button>
      <br>
      <button onclick="moveCar(-0.0001, 0, 0)">⬅️</button>
      <button onclick="moveCar(0.0001, 0, 0)">➡️</button>
      <br>
      <button onclick="moveCar(0, 0, 0.0001)">⬇️</button>
    </div>

    <!-- Pontuação -->
    <div id="score">Moedas: <span id="scoreValue">0</span></div>

    <script>
      let score = 0;

      function moveCar(dx, dy, dz) {
        const car = document.querySelector('#car');
        const pos = car.getAttribute('position');
        const newPos = {
          x: pos.x + dx,
          y: pos.y + dy,
          z: pos.z + dz
        };
        car.setAttribute('position', newPos);
        checkCollision(newPos);
      }

      function checkCollision(carPos) {
        document.querySelectorAll('.coin').forEach(coin => {
          const coinPos = coin.getAttribute('position');
          const distance = Math.sqrt(
            Math.pow(carPos.x - coinPos.x, 2) +
            Math.pow(carPos.y - coinPos.y, 2) +
            Math.pow(carPos.z - coinPos.z, 2)
          );
          if (distance < 0.4) {
            coin.parentNode.removeChild(coin);
            score++;
            document.getElementById('scoreValue').innerText = score;
          }
        });
      }
    </script>
  </body>
</html>
