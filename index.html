<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VR Room</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a-scene vr-mode-ui="enabled: true" embedded>

      <!-- Câmera + Controles para Quest2 -->
      <a-entity id="rig" position="0 1.6 0">
        <a-camera wasd-controls="true" look-controls="true"></a-camera>
      </a-entity>

      <!-- Ambiente da sala -->
      <a-box position="0 0 -5" width="10" height="5" depth="0.2" color="#ccc"></a-box> <!-- Parede -->
      <a-plane rotation="-90 0 0" width="10" height="10" color="#4CAF50"></a-plane> <!-- Chão -->
      <a-box position="2 0.5 -3" width="1" height="1" depth="1" color="#795548"></a-box> <!-- Móvel -->

      <!-- Luz e céu -->
      <a-sky color="#ECECEC"></a-sky>
      <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
    </a-scene>
  </body>
</html>
